[package]
name = "telemost-app"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
directories = "6.0.0"
eframe = { version = "0.34.1", features = ["wgpu"] }
keyring = { version = "3.3", features = ["linux-native", "windows-native"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "3.3.0", features = ["json"] }
